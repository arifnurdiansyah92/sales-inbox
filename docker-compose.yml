# Produksi (VPS). Postgres TIDAK di sini — pakai Postgres yang sudah ada di infra,
# isi POSTGRES_DSN di file .env (lihat .env.example).
services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - backend_data:/data
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'

  frontend:
    build: ./frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  backend_data:
  caddy_data:
  caddy_config:
